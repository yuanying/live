name: Image

# Every run builds the image, and the build runs go test in it. A push to main
# publishes it as main, so that the scanner of vulnerabilities can tell a fix
# that is on main but not yet in a release. A tag publishes a release:
# v1.0.0 is pushed as 1.0.0, 1.0 and latest.
#
# The weekly release (release.yaml) calls this with the version it is about to
# tag. A tag pushed with the run's token starts no workflow, so the image of
# that version is pushed here first, from the commit about to be tagged, under
# the same names a pushed tag would give it, and the tag only follows once it
# exists.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version tag release.yaml is about to push (vX.Y.Z).
        type: string
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The image runs on the workers of fraction, which are all amd64.
  # The arm64 machines there are control planes and take no workloads.
  PLATFORMS: linux/amd64
  # Pushed for a push, and for the call from release.yaml, whose event is the
  # caller's (a schedule or a dispatch). Never for a pull request.
  PUSH: ${{ github.event_name == 'push' || inputs.version != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The default labels carry org.opencontainers.image.source and
      # org.opencontainers.image.revision (the full SHA), which the scanner
      # reads to find the source of the image and the commit it was built from.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder still holds the layers of the build above, so this only pushes.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Moving main (or latest, 1.0) to a new image leaves the previous one
  # untagged. Delete those. Tagged images are never deleted, and the platform
  # manifests and attestations under a tagged index are kept with it. The call
  # from release.yaml leaves this to the next push: a cleanup failing there
  # would fail the call and leave the version untagged.
  cleanup:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The action is not safe to run twice at once against the same package.
    concurrency:
      group: cleanup-image
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          validate: true
